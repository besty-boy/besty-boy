<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="Besty — Développeur iOS, macOS et Full-Stack basé à Rennes">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="55%" stop-color="#101725"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.14"/>
    </linearGradient>

    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="42%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="58%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f8fafc"/>
      <animate attributeName="x1" values="-100%;100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#fb923c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="268" rx="18"/>
    </clipPath>

    <pattern id="subtleGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes floatOrbA {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50%      { transform: translate(26px, 14px) scale(1.08); }
      }
      @keyframes floatOrbB {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50%      { transform: translate(-24px, -16px) scale(1.06); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.45; transform: scale(0.82); }
      }
      @keyframes pulseRing {
        0%   { opacity: 0.65; transform: scale(1); }
        100% { opacity: 0; transform: scale(2.4); }
      }
      @keyframes blinkCaret {
        0%, 49%  { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes drawSignal {
        0%   { stroke-dashoffset: 420; opacity: 0.25; }
        35%  { opacity: 1; }
        70%  { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -420; opacity: 0.25; }
      }
      @keyframes activeRowGlow {
        0%, 100% { opacity: 0.08; }
        50%      { opacity: 0.16; }
      }

      .orbA { animation: floatOrbA 11s ease-in-out infinite; transform-origin: 180px 60px; }
      .orbB { animation: floatOrbB 13s ease-in-out infinite; transform-origin: 720px 210px; }
      .liveDot { animation: pulseDot 2.4s ease-in-out infinite; transform-origin: 51px 43px; }
      .liveRing { animation: pulseRing 2.4s ease-out infinite; transform-origin: 51px 43px; }
      .caret { animation: blinkCaret 1.05s step-end infinite; }
      .activeRow { animation: activeRowGlow 3.2s ease-in-out infinite; }
      .signalActive {
        stroke-dasharray: 160 260;
        animation: drawSignal 4.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Main Card -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="880" height="270" fill="url(#cardBg)"/>
    <rect x="0" y="0" width="880" height="270" fill="url(#subtleGrid)"/>
    <ellipse class="orbA" cx="165" cy="45" rx="230" ry="150" fill="url(#orbBlue)"/>
    <ellipse class="orbB" cx="735" cy="225" rx="220" ry="140" fill="url(#orbOrange)"/>
  </g>
  <rect x="1" y="1" width="878" height="268" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Left Column: Identity -->
  <g>
    <!-- Status pill -->
    <rect x="34" y="31" width="212" height="24" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
    <circle class="liveRing" cx="51" cy="43" r="4" fill="none" stroke="#30d158" stroke-width="1.2"/>
    <circle class="liveDot" cx="51" cy="43" r="3.5" fill="#30d158"/>
    <text x="64" y="46.5" class="mono" font-size="9.8" font-weight="600" fill="#cbd5e1" letter-spacing="0.8">RENNES, FR · APPLE CRAFT</text>

    <!-- Name -->
    <text x="34" y="106" class="sans" font-size="46" font-weight="800" fill="url(#titleShimmer)" letter-spacing="-1.2">Besty</text>

    <!-- Tagline -->
    <text x="35" y="135" class="sans" font-size="16" font-weight="600" fill="#93c5fd">Développeur iOS / macOS &amp; Full-Stack</text>

    <!-- Short Bio -->
    <text x="35" y="164" class="sans" font-size="13" fill="#94a3b8">Passionné par l'écosystème Apple et les apps natives rapides.</text>
    <text x="35" y="184" class="sans" font-size="13" fill="#94a3b8">Objectif : ingénieur iOS — et pourquoi pas Apple un jour.</text>

    <!-- Animated telemetry baseline -->
    <path d="M 35 220 L 148 220 L 160 220 L 168 205 L 177 232 L 187 196 L 197 228 L 206 214 L 214 220 L 412 220"
          fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="signalActive"
          d="M 35 220 L 148 220 L 160 220 L 168 205 L 177 232 L 187 196 L 197 228 L 206 214 L 214 220 L 412 220"
          fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="35" y="246" class="mono" font-size="10.2" fill="#64748b">besty.fr  ·  native-first  ·  zero bloat</text>
  </g>

  <!-- Right Column: Xcode / Swift 6 Card -->
  <g>
    <rect x="448" y="26" width="398" height="218" rx="14" fill="#090d14" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1"/>
    <!-- Window Chrome -->
    <circle cx="468" cy="44" r="4.8" fill="#ff5f57"/>
    <circle cx="484" cy="44" r="4.8" fill="#febc2e"/>
    <circle cx="500" cy="44" r="4.8" fill="#28c840"/>
    <text x="520" y="47.5" class="mono" font-size="11" fill="#94a3b8">Besty.swift</text>
    <rect x="780" y="34" width="52" height="19" rx="6" fill="#fa7343" fill-opacity="0.16" stroke="#fa7343" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="806" y="46.8" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#fb923c">Swift 6</text>
    <line x1="448" y1="60" x2="846" y2="60" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Active editor line highlight -->
    <rect class="activeRow" x="454" y="186" width="386" height="21" rx="4" fill="#38bdf8"/>

    <!-- Line Numbers -->
    <g class="mono" font-size="10.5" fill="#475569" text-anchor="end">
      <text x="472" y="86">1</text>
      <text x="472" y="109">2</text>
      <text x="472" y="132">3</text>
      <text x="472" y="155">4</text>
      <text x="472" y="178">5</text>
      <text x="472" y="201" fill="#94a3b8">6</text>
      <text x="472" y="224">7</text>
    </g>

    <!-- Swift Code -->
    <g class="mono" font-size="11.8">
      <text x="486" y="86"><tspan fill="#ff7ab2" font-weight="600">struct</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#67e8f9" font-weight="600">Besty</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#c4b5fd">Developer</tspan><tspan fill="#94a3b8"> {</tspan></text>
      <text x="500" y="109"><tspan fill="#ff7ab2">let</tspan><tspan fill="#e2e8f0"> base&#160;&#160;</tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#fda4af">"Rennes, France"</tspan></text>
      <text x="500" y="132"><tspan fill="#ff7ab2">let</tspan><tspan fill="#e2e8f0"> apple </tspan><tspan fill="#94a3b8">= [</tspan><tspan fill="#6ee7b7">.swift</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#6ee7b7">.swiftUI</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#6ee7b7">.macOS</tspan><tspan fill="#94a3b8">]</tspan></text>
      <text x="500" y="155"><tspan fill="#ff7ab2">let</tspan><tspan fill="#e2e8f0"> stack </tspan><tspan fill="#94a3b8">= [</tspan><tspan fill="#7dd3fc">.ts</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#7dd3fc">.next</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#7dd3fc">.go</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#7dd3fc">.rust</tspan><tspan fill="#94a3b8">]</tspan></text>
      <text x="500" y="178"><tspan fill="#ff7ab2">let</tspan><tspan fill="#e2e8f0"> ethos </tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#fbbf24">"Native &gt; Electron"</tspan></text>
      <text x="500" y="201"><tspan fill="#ff7ab2">var</tspan><tspan fill="#e2e8f0"> goal&#160;&#160;</tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#fda4af">"iOS Engineer @ Apple"</tspan></text>
      <rect class="caret" x="744" y="189" width="2" height="14.5" rx="1" fill="#38bdf8"/>
      <text x="486" y="224" fill="#94a3b8">}</text>
    </g>
  </g>
</svg>
