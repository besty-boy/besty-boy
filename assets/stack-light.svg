    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes breathe {
        0%, 100% { opacity: 0.95; }
        50%      { opacity: 0.45; }
      }
      .b1 { animation: breathe 3.6s ease-in-out 0.0s infinite; }
      .b2 { animation: breathe 3.6s ease-in-out 0.9s infinite; }
      .b3 { animation: breathe 3.6s ease-in-out 1.8s infinite; }
      .b4 { animation: breathe 3.6s ease-in-out 2.7s infinite; }
    </style>
  </defs>

