<svg xmlns="http://www.w3.org/2000/svg" width="880" height="58" viewBox="0 0 880 58" role="img" aria-label="Designed in Rennes by Besty">
  <defs>
    <linearGradient id="fBgL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="fGlowL" x1="-40%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0071e3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
      <animate attributeName="x1" values="-40%;100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;140%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="57" rx="14" fill="url(#fBgL)" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="14" y="0.5" width="852" height="1.5" fill="url(#fGlowL)"/>
  <text x="440" y="33.5" text-anchor="middle" class="mono" font-size="11.5" fill="#64748b" letter-spacing="0.4">
    Designed in <tspan fill="#0f172a" font-weight="600">Rennes</tspan>  ·  Native first, zero bloat  ·  <tspan fill="#0071e3">besty.fr</tspan>
  </text>
</svg>
