<svg xmlns="http://www.w3.org/2000/svg" width="880" height="10" viewBox="0 0 880 10" role="presentation">
  <defs>
    <linearGradient id="beam" x1="-30%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
      <animate attributeName="x1" values="-30%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;130%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4.5" width="880" height="1" rx="0.5" fill="#64748b" fill-opacity="0.22"/>
  <rect x="0" y="4" width="880" height="2" rx="1" fill="url(#beam)"/>
</svg>
